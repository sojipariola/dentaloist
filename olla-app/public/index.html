<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soji AI Programming Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .status-bar {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status-online {
            background: #28a745;
        }
        
        .status-offline {
            background: #dc3545;
        }
        
        .model-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 14px;
        }
        
        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }
        
        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .assistant-message {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        
        .message pre {
            background: rgba(0, 0, 0, 0.1);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .message code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        #user-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            height: 60px;
            font-family: inherit;
        }
        
        #user-input:focus {
            outline: none;
            border-color: #007bff;
        }
        
        button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.1s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 15px;
            background: #e9ecef;
            border-radius: 12px;
            margin-bottom: 15px;
            max-width: 80px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #6c757d;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 8px;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .message {
                max-width: 90%;
            }
            
            .input-area {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Soji AI Programming Assistant</h1>
            <p>Your local AI coding companion</p>
        </header>
        
        <div class="status-bar">
            <div class="status">
                <span class="status-dot status-offline" id="status-dot"></span>
                <span id="status-text">Checking connection...</span>
            </div>
            <div class="model-selector">
                <label for="model-select">Model:</label>
                <select id="model-select">
                    <option value="llama3.2:1b">Fast Model (llama3.2:1b)</option>
                    <option value="soji:latest">Soji Assistant</option>
                </select>
            </div>
        </div>
        
        <div class="chat-container" id="chat-container">
            <div class="message assistant-message">
                Hello! I'm Soji, your AI programming assistant. I can help you with Python, Java, JavaScript, React, Node.js, and data engineering questions. What would you like to build today?
            </div>
            
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <textarea 
                id="user-input" 
                placeholder="Ask a programming question... (Press Enter to send, Shift+Enter for new line)" 
                rows="1"
            ></textarea>
            <button id="send-button" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let isConnected = false;
        
        // Check connection status on load
        checkConnection();
        
        async function checkConnection() {
            try {
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (data.ollama_available) {
                    statusDot.className = 'status-dot status-online';
                    statusText.textContent = `Connected • ${data.total_models} models available`;
                    isConnected = true;
                    
                    // Update model selector based on available models
                    updateModelSelector(data.models);
                } else {
                    statusDot.className = 'status-dot status-offline';
                    statusText.textContent = 'Ollama not available';
                    isConnected = false;
                }
            } catch (error) {
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');
                statusDot.className = 'status-dot status-offline';
                statusText.textContent = 'Connection failed';
                isConnected = false;
            }
        }
        
        function updateModelSelector(availableModels) {
            const selector = document.getElementById('model-select');
            const sojiOption = selector.querySelector('option[value="soji:latest"]');
            
            if (sojiOption && !availableModels.includes('soji:latest')) {
                sojiOption.disabled = true;
                sojiOption.textContent = 'Soji Assistant (not available)';
            }
        }
        
        function addMessage(text, isUser = false) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = isUser ? 'message user-message' : 'message assistant-message';
            
            // Format code blocks and preserve newlines
            let formattedText = text;
            
            // Handle code blocks (```language\ncode\n```)
            formattedText = formattedText.replace(/```(\w+)?\n([\s\S]*?)```/g, 
                '<pre><code>$2</code></pre>');
            
            // Handle inline code (`code`)
            formattedText = formattedText.replace(/`([^`]+)`/g, 
                '<code>$1</code>');
            
            // Handle newlines
            formattedText = formattedText.replace(/\n/g, '<br>');
            
            messageDiv.innerHTML = formattedText;
            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }
        
        function showTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.style.display = 'block';
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.style.display = 'none';
        }
        
        async function sendMessage() {
            if (!isConnected) {
                alert('Ollama is not connected. Please check if the Ollama service is running.');
                return;
            }
            
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            const button = document.getElementById('send-button');
            const modelSelector = document.getElementById('model-select');
            const selectedModel = modelSelector.value;
            
            // Add user message
            addMessage(message, true);
            input.value = '';
            button.disabled = true;
            input.disabled = true;
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        model: selectedModel
                    })
                });
                
                const data = await response.json();
                
                if (data.response) {
                    addMessage(data.response, false);
                } else if (data.error) {
                    addMessage(`Error: ${data.error}${data.solution ? '\n\n' + data.solution : ''}`, false);
                } else {
                    addMessage('Error: No response from server', false);
                }
                
            } catch (error) {
                addMessage('Error: Could not connect to the server. Make sure the server is running.', false);
            } finally {
                hideTypingIndicator();
                button.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }
        
        // Handle Enter key to send, Shift+Enter for new line
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Auto-resize textarea
        document.getElementById('user-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        
        // Check connection every 30 seconds
        setInterval(checkConnection, 30000);
    </script>
</body>
</html>
