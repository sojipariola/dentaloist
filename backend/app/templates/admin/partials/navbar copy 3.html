<div class="top-navbar">
    <div class="nav-content">
        <div class="nav-welcome">
            <h3>Welcome, {{ current_user.first_name or current_user.email }}!</h3>
            <p>Dental Practice Management Dashboard</p>
        </div>
        <div class="nav-actions">
            <div class="user-menu">
                <div class="user-dropdown">
                    <button class="user-info dropdown-toggle" onclick="toggleUserDropdown()">
                        <i class="material-icons">person</i>
                        {{ current_user.email }}
                        <i class="material-icons dropdown-arrow">arrow_drop_down</i>
                    </button>
                    <div class="dropdown-menu" id="userDropdown">
                        <a href="{{ url_for('admin.detail_view', model_name='user', id=current_user.id) }}" class="dropdown-item">
                            <i class="material-icons">settings</i>
                            My Profile
                        </a>
                        <a href="{{ url_for('admin.edit_view', model_name='user', id=current_user.id) }}" class="dropdown-item">
                            <i class="material-icons">edit</i>
                            Edit Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <!-- Logout Form -->
                        <form method="POST" action="{{ url_for('admin.admin_logout') }}" class="dropdown-form">
                            <button type="submit" class="dropdown-item logout-btn">
                                <i class="material-icons">logout</i>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.user-dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-toggle {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    color: #2c3e50;
    font-weight: 500;
    text-decoration: none;
}

.dropdown-toggle:hover {
    background: #e9ecef;
    border-color: #3498db;
}

.dropdown-arrow {
    transition: transform 0.3s ease;
    font-size: 1.2rem;
}

.user-dropdown.open .dropdown-arrow {
    transform: rotate(180deg);
}

.dropdown-menu {
    position: absolute;
    top: 100%;
    right: 0;
    background: white;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    min-width: 200px;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
}

.user-dropdown.open .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(5px);
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    color: #2c3e50;
    text-decoration: none;
    transition: all 0.3s ease;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-size: 0.95rem;
}

.dropdown-item:hover {
    background: #f8f9fa;
    color: #3498db;
}

.dropdown-item .material-icons {
    font-size: 1.1rem;
    opacity: 0.7;
}

.dropdown-divider {
    height: 1px;
    background: #e9ecef;
    margin: 5px 0;
}

.dropdown-form {
    margin: 0;
}

.logout-btn {
    color: #e74c3c;
}

.logout-btn:hover {
    background: #fee;
    color: #c0392b;
}

/* Close dropdown when clicking outside */
.dropdown-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    display: none;
}

.user-dropdown.open ~ .dropdown-overlay {
    display: block;
}
</style>

<script>
function toggleUserDropdown() {
    const dropdown = document.querySelector('.user-dropdown');
    dropdown.classList.toggle('open');
    
    // Add overlay to close when clicking outside
    if (dropdown.classList.contains('open')) {
        const overlay = document.createElement('div');
        overlay.className = 'dropdown-overlay';
        overlay.onclick = closeAllDropdowns;
        document.body.appendChild(overlay);
    } else {
        closeAllDropdowns();
    }
}

function closeAllDropdowns() {
    document.querySelectorAll('.user-dropdown').forEach(dropdown => {
        dropdown.classList.remove('open');
    });
    document.querySelectorAll('.dropdown-overlay').forEach(overlay => {
        overlay.remove();
    });
}

// Close dropdown when pressing Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeAllDropdowns();
    }
});

// Close dropdown when clicking on a dropdown item
document.addEventListener('click', function(event) {
    if (event.target.closest('.dropdown-item')) {
        closeAllDropdowns();
    }
});
</script>
